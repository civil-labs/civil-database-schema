name: Build Migration Artifact
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version bump or tag suffix'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      custom_tag:
        description: 'Custom tag (if manual chosen above)'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Image Tag
        id: tagger
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${{ inputs.bump }}" = "manual" ]; then
            TAG="${{ inputs.custom_tag }}"
          else
            # Calculate next semver tag from git history or commit sha
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            TAG="${PREV_TAG}-${{ inputs.bump }}.${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/migrations:${{ steps.tagger.outputs.tag }}
            ghcr.io/${{ github.repository }}/migrations:latest

      # Optional: Output Kustomize/ConfigMap manifests to a GitOps release branch
      - name: Generate ConfigMap Manifest Artifact
        run: |
          mkdir -p dist
          kubectl create configmap civil-db-migrations-${{ steps.tagger.outputs.tag }} \
            --from-file=migrations/ \
            --dry-run=client -o yaml > dist/migration-configmap.yaml